# Release to crates.io for Rust projects.

name: Rust Release
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: false
    secrets:
      CRATES_IO_API_KEY:
        description: "API key to use when publishing to crates.io"
        required: true

jobs:
  cargo-release:
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: cargo package
      - name: Dry run the publish
        if: inputs.dry_run
        run: cargo publish --dry-run
      - name: Publish!
        if: ${{ !inputs.dry_run }}
        run: cargo publish
      - name: Mark GitHub release as not prerelease
        if: ${{ !inputs.dry_run && github.event.release != null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit --tag "${{ github.event.release.tag_name }}" --prerelease=false "${{ github.event.release.name }}"
