# tag-version: v1
# CI tasks for Node (TypeScript, JavaScript) repositories. This runs tests, and for repos with
# `format` and `format:check` scripts, applies prettier auto-fixes (pushing them back to the PR
# branch when possible).

# Customization:
# - all customization should be available via inputs. If anything isn't available, try to add it to this as an input instead of copying and modifying directly
#
# TODO:
# - once https://github.com/orgs/community/discussions/25742 or https://github.com/orgs/community/discussions/18055 are implemented,
#   make use of the resulting feature to have a unit test project for this. For now it's too much pain to manage the
#   workspace root across the steps
name: TypeScript CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs:
      smelter_required:
        description: Whether or not sql-smelter is required for this repository's tests.
        type: boolean
        required: false
        default: false
      smelter_branch:
        description: Branch of smelter to check out. Should come from the sql-smelter workflow. Defaults to main.
        type: string
        required: false
        default: "main"
      test_matrix_node_version:
        description: 'A JS array list of versions to be included in the test matrix. Defaults to "["14"]".'
        required: false
        default: '["24"]'
        type: string
      additional_system_deps:
        description: 'A single string of additional dependencies to install on the ubuntu runner using `apt`, ex "protobuf-compiler openssl".'
        type: string
        required: false
        default: ""
      files_to_decrypt:
        description: 'A single string of files to ironhide decrypt using organizational keys, ex ".env.iron .integration.iron".'
        type: string
        required: false
        default: ""
      node_options:
        description: 'A single string of command line flags to pass to any node commands, ex "--max-old-space-size=4096".'
        type: string
        required: false
        default: ""
      run_coverage:
        type: boolean
        default: true
        required: false
      additional_steps:
        type: string
        description: 'A JS array list of additional bash commands to run after the final step, ex "["./build.js", "yarn run compile"]".'
        required: false
        default: ""
      modern_yarn:
        type: boolean
        description: "Use Modern Yarn (v2+). If false use Classic (v1.x)."
        required: false
        default: false
    secrets:
      IRONHIDE_KEYS:
        description: "Keys to use when decrypting optional ironhide files."
        required: false
      WORKFLOW_PAT:
        description: "GitHub PAT to use when checking out an earlier version of the branch for coverage, and to push prettier auto-fix commits back to PR branches. If absent, formatting falls back to check-only mode."
        required: false

jobs:
  test:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment'
    env:
      NODE_OPTIONS: ${{ inputs.node_options }}
      UNDER_TEST_FOLDER: typescript-repo
    strategy:
      matrix:
        node_version: "${{ fromJSON(inputs.test_matrix_node_version) }}"
    defaults:
      run:
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ env.UNDER_TEST_FOLDER }}
      - uses: actions/checkout@v7
        if: ${{ inputs.smelter_required }}
        with:
          repository: IronCoreLabs/sql-smelter
          token: ${{ secrets.WORKFLOW_PAT }}
          ref: ${{ inputs.smelter_branch }}
          path: sql-smelter
      - name: Install refinery
        if: ${{ inputs.smelter_required }}
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: refinery_cli
      - name: Decrypt ironhide files
        uses: IronCoreLabs/ironhide-actions/decrypt@v3
        if: ${{ inputs.files_to_decrypt != '' }}
        with:
          keys: ${{ secrets.IRONHIDE_KEYS }}
          input: ${{ inputs.files_to_decrypt }}
          working-directory: ${{ env.UNDER_TEST_FOLDER }}
      - name: Set yarn mode
        if: ${{ inputs.modern_yarn }}
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: yarn
          cache-dependency-path: ${{ env.UNDER_TEST_FOLDER }}/yarn.lock
      - name: Install additional dependencies
        if: ${{ inputs.additional_system_deps != '' }}
        run: |
          sudo apt update
          sudo apt install ${{ inputs.additional_system_deps }}
      - name: Install modules
        run: yarn
      - name: Run tests
        run: yarn run test
      - name: Check test coverage
        if: ${{ inputs.run_coverage && github.base_ref != '' }}
        uses: joshuali925/Jest-Coverage-Diff@custom-directory
        with:
          fullCoverageDiff: false
          delta: 0.2
          afterSwitchCommand: yarn
          accessToken: ${{ secrets.WORKFLOW_PAT }}
          directory: ${{ env.UNDER_TEST_FOLDER }}
      - name: Additional commands
        if: ${{ inputs.additional_steps != '' }}
        shell: bash
        run: ${{ join(inputs.additional_steps, '; ') }}

  # Unlike scalafmt or cargo fmt, prettier isn't guaranteed to be set up in a consumer repo, so
  # repos opt out by omitting the scripts. This is a separate job so those repos skip the install entirely.
  detect-format:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment'
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - name: Look for prettier scripts
        id: check
        run: |
          if jq -e '.scripts.format and .scripts["format:check"]' package.json > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping prettier formatting: package.json needs both a 'format' and a 'format:check' script."
          fi

  # Not folded into `test`: that job is matrixed over node versions, so an auto-fix step there
  # would race itself on push.
  format:
    runs-on: ubuntu-24.04
    needs: detect-format
    if: needs.detect-format.outputs.present == 'true'
    env:
      NODE_OPTIONS: ${{ inputs.node_options }}
      UNDER_TEST_FOLDER: typescript-repo
    steps:
      - name: Determine if auto-fix push is possible
        id: push_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        # Forks can't be pushed to and push events have no PR branch to fix, so both check only.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_PAT" = "true" ] && [ "$IS_FORK" != "true" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          path: ${{ env.UNDER_TEST_FOLDER }}
          # The branch tip rather than the merge ref, so the auto-fix commit can be pushed back.
          ref: ${{ steps.push_mode.outputs.can_push == 'true' && github.head_ref || '' }}
          token: ${{ steps.push_mode.outputs.can_push == 'true' && secrets.WORKFLOW_PAT || github.token }}
      - name: Set yarn mode
        if: ${{ inputs.modern_yarn }}
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.test_matrix_node_version)[0] }}
          cache: yarn
          cache-dependency-path: ${{ env.UNDER_TEST_FOLDER }}/yarn.lock
      - name: Install additional dependencies
        if: ${{ inputs.additional_system_deps != '' }}
        run: |
          sudo apt update
          sudo apt install ${{ inputs.additional_system_deps }}
      # Prettier comes from the lockfile, not a global install, so it can't disagree with the
      # developer's version about the same files.
      - name: Install modules
        run: yarn
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
      - name: Apply prettier auto-fixes
        if: steps.push_mode.outputs.can_push == 'true'
        id: autofix
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        run: |
          yarn format
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push auto-fixes, then fail
        if: steps.autofix.outputs.changed == 'true'
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        # Failing after the push is what makes the unformatted commit visible; the push alone
        # would land a green run and nobody would know.
        run: |
          git config user.email ops@ironcorelabs.com
          git config user.name "Leeroy Travis"
          git add -u
          git commit -m "Apply prettier auto-fixes"
          git push origin "HEAD:$HEAD_REF"
          echo "::error::prettier auto-fixes were applied and pushed. CI will re-run on the new commit. Failing this run so the unformatted commit is visibly flagged."
          exit 1
      - name: Check prettier
        if: steps.push_mode.outputs.can_push != 'true'
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        run: yarn format:check || { echo "::error::Formatting check failed. Run 'yarn format' locally and commit the result."; exit 1; }
