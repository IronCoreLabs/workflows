# CI for Scala projects. This compiles, runs tests, applies scalafmt + scalafix auto-fixes (pushing them back
# to the PR branch when possible), and produces a coverage report.

name: Scala CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
    inputs:
      test_command:
        description: sbt command used to test. Typically "test" (default) or "testAll".
        type: string
        required: false
        default: "test"
      coverage:
        description: Whether or not to run `coverage` and `coverageReport`.
        type: boolean
        required: false
        default: true
      additional_system_deps:
        description: A single string of additional dependencies to install on the ubuntu runner using `apt`, ex "libsodium-dev openssl".
        type: string
        required: false
        default: ""
      download_release_binary_repo:
        description: Repo to download an additional binary from (e.g. IronCoreLabs/ironoxide-swig-bindings)
        type: string
        required: false
        default: ""
      download_release_binary_name:
        description: Name for additional binary to download from `download_release_binary_repo` (e.g. libironoxide_java.so)
        type: string
        required: false
        default: ""
      smelter_required:
        description: Whether or not sql-smelter is required for this repository's tests.
        type: boolean
        required: false
        default: false
      smelter_branch:
        description: Branch of smelter to check out. Should come from the sql-smelter workflow. Defaults to main.
        type: string
        required: false
        default: "main"
    secrets:
      WORKFLOW_PAT:
        description: GitHub PAT used to push scalafmt/scalafix auto-fix commits back to PR branches. If absent, the workflow falls back to check-only mode.
        required: false

jobs:
  test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    env:
      UNDER_TEST_FOLDER: scala-repo
    steps:
      - name: Determine if auto-fix push is possible
        id: push_mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        # Auto-fix push is only attempted on same-repo PRs with WORKFLOW_PAT available.
        # Fork PRs and push events (e.g., to main) fall back to check-only mode.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_PAT" = "true" ] && [ "$IS_FORK" != "true" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          path: ${{ env.UNDER_TEST_FOLDER }}
          # When pushable, check out the PR branch tip (not the merge ref) with the PAT so the auto-fix commit can be pushed back.
          ref: ${{ steps.push_mode.outputs.can_push == 'true' && github.head_ref || '' }}
          token: ${{ steps.push_mode.outputs.can_push == 'true' && secrets.WORKFLOW_PAT || github.token }}
      - uses: actions/checkout@v6
        if: ${{ inputs.smelter_required }}
        with:
          repository: IronCoreLabs/sql-smelter
          token: ${{ secrets.WORKFLOW_PAT }}
          ref: ${{ inputs.smelter_branch }}
          path: sql-smelter
      - name: Install refinery
        if: ${{ inputs.smelter_required }}
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: refinery_cli
      - name: Install additional dependencies
        if: ${{ inputs.additional_system_deps != '' }}
        run: |
          sudo apt update
          sudo apt install ${{ inputs.additional_system_deps }}
      - name: Restore caches
        uses: coursier/cache-action@v8
      - name: Setup Scala
        uses: coursier/setup-action@v3
        with:
          jvm: 21
          apps: sbt
      - name: Download additional binary
        if: ${{ inputs.download_release_binary_repo != '' && inputs.download_release_binary_name != '' }}
        uses: robinraju/release-downloader@v1.13
        with:
          repository: ${{ inputs.download_release_binary_repo }}
          fileName: ${{ inputs.download_release_binary_name }}
          latest: true
      - name: Print docker version
        run: docker --version
      - name: Apply scalafmt and scalafix auto-fixes
        if: steps.push_mode.outputs.can_push == 'true'
        id: autofix
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        env:
          MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID: ${{ vars.MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID }}
          MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY: ${{ secrets.MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY }}
          LD_LIBRARY_PATH: "./"
        run: |
          sbt scalafmtAll scalafixAll
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push auto-fixes, then fail
        if: steps.autofix.outputs.changed == 'true'
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        # Push the fix so CI re-runs cleanly on the new commit, then fail this run
        # so the dev sees a red signal that their PR needed auto-formatting.
        run: |
          git config user.email ops@ironcorelabs.com
          git config user.name "Leeroy Travis"
          git add -A
          git commit -m "Apply scalafmt and scalafix auto-fixes"
          git push origin "HEAD:$HEAD_REF"
          echo "::error::scalafmt/scalafix auto-fixes were applied and pushed. CI will re-run on the new commit. Failing this run so the unformatted commit is visibly flagged."
          exit 1
      - name: Check scalafmt and scalafix
        if: steps.push_mode.outputs.can_push != 'true'
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        env:
          MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID: ${{ vars.MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID }}
          MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY: ${{ secrets.MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY }}
          LD_LIBRARY_PATH: "./"
        run: sbt scalafmtCheckAll "scalafixAll --check"
      - name: Build and test
        if: steps.autofix.outputs.changed != 'true'
        working-directory: ${{ env.UNDER_TEST_FOLDER }}
        env:
          MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID: ${{ vars.MAVEN_IRONCORELABS_COM_AWS_ACCESS_KEY_ID }}
          MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY: ${{ secrets.MAVEN_IRONCORELABS_COM_AWS_SECRET_KEY }}
          LD_LIBRARY_PATH: "./" # If a release was downloaded, it would be here. If not, no harm done.
        run: sbt ${{ inputs.coverage && 'coverage' || '' }} ${{ inputs.test_command }} ${{ inputs.coverage && 'coverageReport' || '' }}
